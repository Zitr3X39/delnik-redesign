<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дельник — прототип интерфейса</title>
<style>
html,body{margin:0;height:100%}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#14171a;background:#f3f5f7;display:flex;align-items:center;justify-content:center}
.boot{text-align:center;color:#63696f;padding:24px;max-width:520px}
.boot b{display:block;font-size:18px;color:#14171a;margin-bottom:6px}
.sp{width:26px;height:26px;margin:0 auto 16px;border:3px solid #C6D9FE;border-top-color:#2563EB;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="sp"></div><b>Дельник</b>Загружаем прототип…</div>
<script>
(function(){
  var PARTS=['v2/app.gz.b64.00','v2/app.gz.b64.01'];
  function fail(msg){
    var b=document.getElementById('boot');
    if(b){b.innerHTML='<b>Не удалось загрузить прототип</b>'+msg;}
  }
  if(typeof DecompressionStream==='undefined'){
    fail('Браузер не поддерживает распаковку. Откройте в свежем Chrome, Safari или Firefox.');
    return;
  }
  Promise.all(PARTS.map(function(p){
    return fetch(p,{cache:'no-store'}).then(function(r){
      if(!r.ok){throw new Error(p+' → HTTP '+r.status);}
      return r.text();
    });
  })).then(function(chunks){
    var b64=chunks.join('').replace(/\s+/g,'');
    var bin=atob(b64), n=bin.length, bytes=new Uint8Array(n);
    for(var i=0;i<n;i++){bytes[i]=bin.charCodeAt(i);}
    var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }).then(function(html){
    document.open();
    document.write(html);
    document.close();
  }).catch(function(e){
    fail(String((e&&e.message)||e));
  });
})();
</script>
</body>
</html>
