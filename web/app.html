<script>
(function(){
  function fail(m){
    var b=document.getElementById('boot');
    if(b){b.innerHTML='<b>Не удалось развернуть прототип</b>'+m+'<p><a href="main.html">Открыть статичные экраны</a></p>';}
  }
  try{
    if(typeof DecompressionStream==='undefined'){
      fail('Браузер не поддерживает распаковку: нужен Chrome 80+, Safari 16.4+ или Firefox 113+.');
      return;
    }
    var t=document.getElementById('pl').textContent.replace(/\s+/g,'');
    var bin=atob(t), n=bin.length, by=new Uint8Array(n);
    for(var i=0;i<n;i++){by[i]=bin.charCodeAt(i);}
    var st=new Blob([by]).stream().pipeThrough(new DecompressionStream('gzip'));
    new Response(st).text().then(function(h){
      document.open();
      document.write(h);
      document.close();
    }).catch(function(e){fail(String((e&&e.message)||e));});
  }catch(e){
    fail(String((e&&e.message)||e));
  }
})();
</script>
