<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дельник — прототип интерфейса</title>
<style>
html,body{margin:0;height:100%}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#14171a;background:#f3f5f7;display:flex;align-items:center;justify-content:center}
.boot{text-align:center;color:#63696f;padding:24px;max-width:560px}
.boot b{display:block;font-size:18px;color:#14171a;margin-bottom:6px}
.boot a{color:#2563EB}
.sp{width:26px;height:26px;margin:0 auto 16px;border:3px solid #C6D9FE;border-top-color:#2563EB;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="sp"></div><b>Дельник</b>Разворачиваем прототип…</div>
<script src="v2/p0.js"></script>
<script src="v2/p1.js"></script>
<script src="v2/p2.js"></script>
<script src="v2/p3.js"></script>
<script src="v2/p4.js"></script>
<script src="v2/p5.js"></script>
<script src="v2/p6.js"></script>
<script src="v2/p7.js"></script>
<script src="v2/p8.js"></script>
<script>
(function(){
  function fail(m){
    var b=document.getElementById('boot');
    if(b){b.innerHTML='<b>Не удалось развернуть прототип</b>'+m+'<p><a href="main.html">Открыть статичные экраны</a></p>';}
  }
  function hex(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  }
  try{
    var P=self.P||[];
    if(P.length!==9){fail('Загружено частей: '+P.length+' из 9.');return;}
    if(typeof DecompressionStream==='undefined'){fail('Браузер не поддерживает распаковку: нужен Chrome 80+, Safari 16.4+ или Firefox 113+.');return;}
    var t=P.join('').replace(/\s+/g,'');
    var bin=atob(t), n=bin.length, by=new Uint8Array(n);
    for(var i=0;i<n;i++){by[i]=bin.charCodeAt(i);}
    var st=new Blob([by]).stream().pipeThrough(new DecompressionStream('gzip'));
    new Response(st).text().then(function(h){
      document.open();
      document.write(h);
      document.close();
    }).catch(function(e){
      if(self.crypto&&self.crypto.subtle){
        self.crypto.subtle.digest('SHA-256',by).then(function(d){
          fail('Данные повреждены: '+n+' б, sha '+hex(d).slice(0,16));
        }).catch(function(){fail('Данные повреждены: '+n+' б');});
      }else{
        fail('Данные повреждены: '+n+' б');
      }
    });
  }catch(e){
    fail(String((e&&e.message)||e));
  }
})();
</script>
</body>
</html>
