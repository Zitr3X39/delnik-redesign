name: shabashka_app
description: "Дельник — подработка рядом"
publish_to: 'none'
version: 1.0.11+11

environment:
  # Пол ослаблен с ^3.12.2: CI (GitHub Actions, stable-канал Flutter)
  # падал на pub get, т.к. stable не всегда имеет Dart >= 3.12.2.
  # flutter_lints 6 требует >= 3.8.0 — это и есть безопасный пол.
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  supabase_flutter: ^2.5.0
  geolocator: ^13.0.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_rustore_push: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/onboarding/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
